# Report 14 — generalization-prep v2 of the class-balanced multi-gate
# keypoint config. Identical to deeplabv3plus_keypoint_multi_balanced.yaml
# except two changes motivated by the report-14 gap analysis:
#
#   data.imagenet_norm: true      # was false in v1 — encoder is
#                                 # ImageNet-pretrained, so /255-only input
#                                 # was a distribution mismatch at conv1.
#                                 # Predictor reads this flag from the
#                                 # ckpt's data_config at load time, so
#                                 # inference parity is automatic.
#   data.augment_strong: true     # adds perspective warp, brightness /
#                                 # contrast / gamma jitter, cutout, JPEG
#                                 # compression, and stronger HSV jitter
#                                 # on top of the v1 chain. Behind a single
#                                 # flag so the v1 baseline is recoverable
#                                 # by flipping it off.
#
# Use: python scripts/train.py --config configs/deeplabv3plus_keypoint_multi_balanced_v2.yaml

data:
  img_size: 384
  sam_subdir: sam_masked
  use_sam_masks: true
  imagenet_norm: true            # ← change 1 vs v1
  augment_strong: true           # ← change 2 vs v1
  heatmap_sigma: 3.0
  multi_gate_target: true
  per_flight_cap: 150
  cap_seed: 42

model:
  name: deeplabv3plus
  width_factor: 4
  encoder_weights: imagenet
  dropout_p: 0.1
  keypoint_head: true
  n_keypoints: 4

loss:
  deep_supervision_weights: [1]
  bce_weight: 2.0
  keypoint_weight: 100.0
  keypoint_fg_weight: 10.0

train:
  epochs: 100
  batch_size: 8
  lr: 3.0e-4
  optimizer: adamw
  sgd_momentum: 0.9
  weight_decay: 1.0e-4
  seed: 42
  num_workers_train: 16
  num_workers_val: 16
  scheduler:
    type: polynomial_hf
    warmup_ratio: 0.1
    power: 0.9
    lr_end: 1.0e-6
  performance:
    compile: true
    compile_mode: max-autotune
    amp: true
    amp_dtype: bf16
    channels_last: true
    cudnn_benchmark: false
    matmul_precision: high
    prefetch_factor: 4
  checkpoint_name: best_deeplabv3plus_keypoint_multi_balanced_v2.pth

eval:
  threshold: 0.5

postprocess:
  max_dist: 100.0
  ransac_threshold: 5.0
  max_translation: 150.0
