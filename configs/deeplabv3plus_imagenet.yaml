# DeepLabV3+ with ResNet-34 ImageNet-pretrained encoder + matching ImageNet
# input normalisation. Otherwise mirrors configs/default.yaml so this is a
# clean P0-3 ablation cell against the gatenet baseline.
#
# Use: python scripts/train.py --config configs/deeplabv3plus_imagenet.yaml

data:
  img_size: 384
  sam_subdir: sam_masked
  use_sam_masks: true
  # ImageNet mean/std subtraction in the dataloader. The predictor reads
  # this back from the checkpoint and replays it at inference for parity.
  imagenet_norm: true

model:
  name: deeplabv3plus
  width_factor: 4              # ignored by deeplabv3plus, kept for schema parity
  encoder_weights: imagenet    # smp downloads the resnet34 imagenet checkpoint on first build
  dropout_p: 0.1

loss:
  deep_supervision_weights: [1]   # single-head, ds_weights=(1.0,) inside the model wrapper
  bce_weight: 2.0

train:
  epochs: 100
  batch_size: 8
  lr: 3.0e-4
  optimizer: adamw
  sgd_momentum: 0.9
  weight_decay: 1.0e-4
  seed: 42                     # same seed as default.yaml — fair ablation
  num_workers_train: 16
  num_workers_val: 16
  scheduler:
    type: polynomial_hf
    warmup_ratio: 0.1
    power: 0.9
    lr_end: 1.0e-6
  performance:
    compile: true
    compile_mode: max-autotune
    amp: true
    amp_dtype: bf16
    channels_last: true
    cudnn_benchmark: false
    matmul_precision: high
    prefetch_factor: 4
  checkpoint_name: best_deeplabv3plus_imagenet.pth

eval:
  threshold: 0.5

postprocess:
  max_dist: 100.0
  ransac_threshold: 5.0
  max_translation: 150.0
