# Task 2 from report-12 next-steps: class-balanced multi-gate keypoint
# training. Identical to deeplabv3plus_keypoint_multi.yaml except:
#   data.per_flight_cap: 150
#   data.cap_seed: 42
#
# Motivation: report 12's file-count survey (906 ↔ 303) translated to
# ~302 ↔ ~101 actual crops per piloted flight (3 files per crop), plus
# autonomous flights with as few as 39 crops. The 4000-crop SAM train
# pool has 11 flights at the over-representation tail and 17 flights
# below 150 crops. Cap=150 truncates the over-represented flights down
# to 150 (uniformising those 11) while leaving the under-represented
# flights intact at their original sizes. Total: 4000 → 2903 samples
# (−27%) across 28 flights with max=150 and min=39 (autonomous
# lemniscates).
#
# Use: python scripts/train.py --config configs/deeplabv3plus_keypoint_multi_balanced.yaml

data:
  img_size: 384
  sam_subdir: sam_masked
  use_sam_masks: true
  imagenet_norm: false
  heatmap_sigma: 3.0
  multi_gate_target: true
  per_flight_cap: 150            # ← the only knob different from the report-10 config
  cap_seed: 42                   # deterministic sub-sampling per CLAUDE.md §0
  # NB: smoke test on the actual SAM train pool showed per-flight crop counts
  # range from 39 (autonomous lemniscates) to ~302 (01p-ellipse). cap=150
  # uniformises the 11 over-represented piloted flights at the cap; the 17
  # under-represented flights (mostly autonomous + 13p-trackRATM at 101)
  # keep all their crops. Final pool: 2903 samples across 28 flights with
  # min=39, max=150. This is a partial balance — the autonomous flights
  # remain under-represented by design (no oversampling).

model:
  name: deeplabv3plus
  width_factor: 4
  encoder_weights: imagenet
  dropout_p: 0.1
  keypoint_head: true
  n_keypoints: 4

loss:
  deep_supervision_weights: [1]
  bce_weight: 2.0
  keypoint_weight: 100.0
  keypoint_fg_weight: 10.0

train:
  epochs: 100
  batch_size: 8
  lr: 3.0e-4
  optimizer: adamw
  sgd_momentum: 0.9
  weight_decay: 1.0e-4
  seed: 42
  num_workers_train: 16
  num_workers_val: 16
  scheduler:
    type: polynomial_hf
    warmup_ratio: 0.1
    power: 0.9
    lr_end: 1.0e-6
  performance:
    compile: true
    compile_mode: max-autotune
    amp: true
    amp_dtype: bf16
    channels_last: true
    cudnn_benchmark: false
    matmul_precision: high
    prefetch_factor: 4
  checkpoint_name: best_deeplabv3plus_keypoint_multi_balanced.pth

eval:
  threshold: 0.5

postprocess:
  max_dist: 100.0
  ransac_threshold: 5.0
  max_translation: 150.0
