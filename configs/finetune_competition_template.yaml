# TEMPLATE — fine-tune the strongest pretraining checkpoint on competition
# footage that lands later in the campaign. Copy to e.g.
# ``configs/finetune_competition_2026.yaml`` and fill in the TODO fields.
#
# Recipe (report 14 — generalization preparation):
#   1. Pre-train on TII pool with augment_strong + imagenet_norm (v2 config).
#   2. When ≥50 labelled competition frames exist, point ``train.init_from``
#      at the v2 ckpt below and ``data.extra_train_dirs`` at the competition
#      sample directory. The TII pool is kept (regularisation) and the
#      competition source is up-weighted via ``data.sample_dir_weights``.
#   3. Encoder frozen (``train.freeze_encoder: true``) — standard transfer-
#      learning recipe per Kornblith et al. 2019 (arXiv:1805.08974). The
#      decoder + keypoint head still update. Lower LR (1e-4) and fewer
#      epochs (20) — small-data fine-tune, not a from-scratch run.
#
# Use: python scripts/train.py --config configs/finetune_competition_2026.yaml
#
# CLAUDE.md §0 reminder: a labelled competition frame is precious. Cross-
# check the held-out split before kicking off this run — the competition
# subset used here MUST NOT overlap with whatever subset you reserve for
# the final accept/reject benchmark.

data:
  img_size: 384
  sam_subdir: sam_masked
  use_sam_masks: true
  imagenet_norm: true
  augment_strong: true
  heatmap_sigma: 3.0
  multi_gate_target: true
  per_flight_cap: 150        # caps TII flights at 150 (matches v2 pretraining)
  cap_seed: 42

  # ---- COMPETITION DATA WIRING (fill these in when the data arrives) ----
  extra_train_dirs:
    - TODO_PATH_TO_COMPETITION_SAM_TRAIN_DIR
  # First entry = TII train pool (default <SAM_ROOT>/train), second = the
  # competition dir above. Adjust weights based on the competition source
  # size: e.g. 100 frames × 30 = 3000 instances per epoch, comparable to
  # TII's 2903 capped samples.
  sample_dir_weights: [1, 30]

model:
  name: deeplabv3plus
  width_factor: 4
  encoder_weights: imagenet  # ignored when init_from overrides; kept for
                             # schema compatibility with the loader.
  dropout_p: 0.1
  keypoint_head: true
  n_keypoints: 4

loss:
  deep_supervision_weights: [1]
  bce_weight: 2.0
  keypoint_weight: 100.0
  keypoint_fg_weight: 10.0

train:
  epochs: 20                 # ← smaller than from-scratch (100)
  batch_size: 8
  lr: 1.0e-4                 # ← 1/3 of from-scratch (3e-4)
  optimizer: adamw
  sgd_momentum: 0.9
  weight_decay: 1.0e-4
  seed: 42
  num_workers_train: 16
  num_workers_val: 16
  scheduler:
    type: polynomial_hf
    warmup_ratio: 0.05       # ← shorter warmup, weights start near optimum
    power: 0.9
    lr_end: 1.0e-6
  performance:
    compile: true
    compile_mode: max-autotune
    amp: true
    amp_dtype: bf16
    channels_last: true
    cudnn_benchmark: false
    matmul_precision: high
    prefetch_factor: 4
  checkpoint_name: best_deeplabv3plus_keypoint_multi_balanced_v2_finetuned.pth

  # ---- FINETUNE HOOKS ----
  init_from: checkpoints/best_deeplabv3plus_keypoint_multi_balanced_v2.pth
  freeze_encoder: true       # encoder updates would over-fit on the
                             # small competition set; standard recipe is
                             # to only retrain the decoder + heads.
                             # Encoder stays frozen for ALL 20 epochs
                             # (no mid-training unfreeze) — Kornblith
                             # 2019 §3 finds two-stage schedules add
                             # complexity without a consistent win at
                             # this data scale (<10k frames).

eval:
  threshold: 0.5

postprocess:
  max_dist: 100.0
  ransac_threshold: 5.0
  max_translation: 150.0
